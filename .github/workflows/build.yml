name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive App (Unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VocabTok.xcodeproj \
            -scheme VocabTok \
            -destination 'generic/platform=iOS' \
            -archivePath build/VocabTok.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning: unre|\*\* ARCHIVE" || true
          test -d build/VocabTok.xcarchive/Products/Applications/VocabTok.app || { grep -B2 -A6 "error:" build.log | head -200; exit 1; }

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/VocabTok.xcarchive/Products/Applications/VocabTok.app Payload/
          zip -qry VocabTok.ipa Payload
          rm -rf Payload
          ls -lh VocabTok.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VocabTok-IPA
          path: VocabTok.ipa

      - name: Publish IPA to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VocabTok build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            File IPA chưa ký (unsigned). Cài bằng AltStore, Sideloadly, TrollStore hoặc ký lại bằng chứng chỉ của bạn.
            Commit: ${{ github.sha }}
          files: VocabTok.ipa
