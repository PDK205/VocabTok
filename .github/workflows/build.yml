name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive App (Unsigned)
        run: |
          xcodebuild archive \
            -project VocabTok.xcodeproj \
            -scheme VocabTok \
            -destination 'generic/platform=iOS' \
            -archivePath build/VocabTok.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/VocabTok.xcarchive/Products/Applications/VocabTok.app Payload/
          zip -r VocabTok.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VocabTok-IPA
          path: VocabTok.ipa